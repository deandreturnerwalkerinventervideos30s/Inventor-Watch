<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventor Watch | Universal Search</title>
    <style>
        :root { --gold: #ffcc00; --dark: #050505; --accent: #1a1a1a; }
        body { font-family: 'Arial', sans-serif; background: var(--dark); color: white; margin: 0; text-align: center; }
        
        /* Cinematic Header */
        header { padding: 80px 20px; background: linear-gradient(rgba(0,0,0,0.8), var(--dark)), url('https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80'); background-size: cover; border-bottom: 5px solid var(--gold); }
        h1 { font-size: 3.5em; color: var(--gold); text-transform: uppercase; letter-spacing: 5px; margin: 0; }
        p { font-size: 1.2em; color: #aaa; margin: 10px 0 30px 0; }

        /* The Universal Search Bar */
        .search-container { position: relative; max-width: 700px; margin: auto; }
        #mainSearch { width: 90%; padding: 20px 30px; border-radius: 50px; border: 3px solid var(--gold); background: #111; color: white; font-size: 1.3em; outline: none; box-shadow: 0 0 30px rgba(255, 204, 0, 0.4); }
        
        /* Action Buttons */
        .btn-group { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .search-btn { padding: 15px 30px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 1em; }
        .yt-btn { background: #ff0000; color: white; } /* YouTube Red */
        .bio-btn { background: #ffffff; color: black; } /* Info White */
        .money-btn { background: #2ecc71; color: white; } /* Money Green */

        /* Results Display Area */
        #displayZone { margin-top: 50px; padding: 40px; background: var(--accent); border-radius: 20px; max-width: 900px; margin-left: auto; margin-right: auto; display: none; }
        .result-text { font-size: 1.5em; color: var(--gold); }
    </style>
</head>
<body>

<header>
    <h1>Inventor Watch</h1>
    <p>The Global Database of Human Ingenuity</p>
    
    <div class="search-container">
        <input type="text" id="mainSearch" placeholder="Type an Inventor, Product, or Company...">
    </div>

    <div class="btn-group">
        <button class="search-btn yt-btn" onclick="masterSearch('video')">Watch Documentaries</button>
        <button class="search-btn bio-btn" onclick="masterSearch('story')">Read Full Story</button>
        <button class="search-btn money-btn" onclick="masterSearch('money')">Net Worth & Facts</button>
    </div>
</header>

<div id="displayZone">
    <p class="result-text" id="statusMsg"></p>
    <p>Your request is being processed through the global archives...</p>
</div>

<script>
    function masterSearch(type) {
        let query = document.getElementById('mainSearch').value;
        if (!query) {
            alert("Please enter a name first!");
            return;
        }

        // Show the status zone
        document.getElementById('displayZone').style.display = "block";
        document.getElementById('statusMsg').innerText = "Finding data for: " + query;

        // Logic for different search types
        if (type === 'video') {
            // Searches YouTube specifically for documentaries and movies
            window.open(`https://www.youtube.com/results?search_query=${query}+inventor+documentary+movie`, '_blank');
        } 
        else if (type === 'story') {
            // Goes to Wikipedia/History sources
            window.open(`https://en.wikipedia.org/wiki/Special:Search?search=${query}`, '_blank');
        } 
        else if (type === 'money') {
            // Specifically looks for Net Worth and Financial Success
            window.open(`https://www.google.com/search?q=${query}+net+worth+and+success+story`, '_blank');
        }
    }
</script>

</body>
</html>
