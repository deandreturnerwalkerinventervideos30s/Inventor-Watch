<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventor Watch</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ffcc00; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 15px; border: 1px solid #333; }
        .card img { width: 100%; border-radius: 5px; }
        .card h3 { margin: 10px 0; }
        .card p { font-size: 0.9em; color: #bbb; }
        .btn { display: block; text-align: center; background: #ffcc00; color: black; padding: 10px; 
               text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Inventor Watch</h1>
    <p style="text-align:center;">Celebrating the minds that build the future.</p>

    <div class="grid">
        <div class="card">
            <h3>Charles B. Brooks</h3>
            <p>Inventor of the street-sweeping truck (1896) and improvements to the paper punch.</p>
            <a href="https://www.youtube.com/results?search_query=charles+b+brooks+inventor" class="btn">Watch Stories</a>
        </div>

        <div class="card">
            <h3>Garrett Morgan</h3>
            <p>The Akron-born legend who invented the three-position traffic signal and gas mask.</p>
            <a href="https://www.youtube.com/results?search_query=garrett+morgan+inventions" class="btn">Watch Stories</a>
        </div>
    </div>

</body>
</html>
